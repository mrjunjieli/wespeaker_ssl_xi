### Modified by Junjie Li (junjie98.li@connect.polyu.hk).
### Extended from the original WeSpeaker/W2V-BERT recipe for full fine-tuning
### after merging the Stage-1 Q/K LoRA adapters into the W2V-BERT frontend.
###
### Stage-2 training config: full fine-tuning of W2V-BERT 2.0 + MHFA.
### Ported from wespeaker_hubert v4_pruning
### conf/baseline_vox2/mhfa_W2VB_ft_v5.yaml (the recipe that produced the
### mhfa_W2VB_ft_v5 checkpoint), with the same two changes as stage-1
### (w2vbert -> w2vbert_sv key rename, assets/ path_or_url).
###
### Stage handoff used by this extended recipe:
###   python wespeaker/bin/merge_w2vbert_lora.py \
###     --config <stage1_exp>/config.yaml \
###     --src_model <stage1_exp>/models/avg_model.pt \
###     --dst_model <stage2_exp>/models/model_0.pt
###   ... train.py --config this_file --checkpoint <stage2_exp>/models/model_0.pt
###
### frontend_lr_ratio NOTE: in this repo the 0.1x differential frontend lr is
### actually applied (train.py passes the model to the scheduler). In the
### original v4_pruning run the scheduler never received the model reference,
### so this setting was silently inactive and the released mhfa_W2VB_ft_v5
### checkpoint was effectively trained with FULL frontend lr. Set
### frontend_lr_ratio: 1.0 to replicate that historical behavior exactly.

exp_dir: exp/v2_w2vbert_sv/stage2_ft
gpus: "[0,1,2,3,4,5,6,7]"
num_avg: 2
enable_amp: True # whether enable automatic mixed precision training
do_lm: False

seed: 9999
num_epochs: 8
save_epoch_interval: 1 # save model every epoch
log_batch_interval: 100 # log every 100 batchs

dataloader_args:
  batch_size: 16
  num_workers: 8
  pin_memory: False
  prefetch_factor: 8
  drop_last: True

dataset_args:
  # the sample number which will be traversed within one epoch, if the value equals to 0,
  # the utterance number in the dataset will be used as the sample_num_per_epoch.
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 50
    max_num_frames: 400
  resample_rate: 16000
  speed_perturb: False
  num_frms: 200
  aug_prob: 0.6 # prob to add reverb & noise aug per sample
  frontend: "w2vbert_sv"
  w2vbert_sv_args:
    upstream_args:
      name: 'config_baseline.json'
      path_or_url: assets/w2v-bert-2.0
    frozen: False
    use_lora: False
    frame_shift: 20
    frame_length: 20
  cmvn: False
  cmvn_args:
    norm_mean: False
    norm_var: False
  spec_aug: False
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6

model: SSL_BACKEND_MHFA_LN_UCube
model_init: null
model_args:
  feat_dim: -1  # overridden by frontend.output_size() (=1024) in train.py
  embed_dim: 256
  compression_dim: 128
  uncertainty_hidden_size: 256
  uncertainty_num_heads: 8
  uncertainty_dropout: 0.2
  train_prior_mean: True
  train_prior_prec: True
  feature_grad_mult: 1.0
  nb_layer: 25

projection_args:
  project_type: "arc_margin"
  scale: 32.0
  easy_margin: False

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.2
  final_margin: 0.4
  increase_start_epoch: 2
  fix_start_epoch: 6
  update_margin: True
  increase_type: "linear" # exp, linear

loss: CrossEntropyLoss
loss_args: {}

optimizer: AdamW
optimizer_args:
  weight_decay: 1.0e-5

scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 5.0e-5
  final_lr: 1.0e-6
  warm_up_epoch: 1
  warm_from_zero: True
  frontend_modules: ["frontend"]
  frontend_lr_ratio: 0.5  # see NOTE above; 1.0 replicates the historical run
