# Frozen-frontend position-encoding ablation; otherwise matches Transformer Stage1.
exp_dir: exp/v2_w2vbert_sv/mhfa_ln_gaussian_noadapter_transformer_nopos_stage1
gpus: "[0,1]"
num_avg: 4
enable_amp: True
do_lm: False

seed: 716
num_epochs: 30
save_epoch_interval: 5
log_batch_interval: 100

dataloader_args:
  batch_size: 256
  num_workers: 8
  pin_memory: True
  prefetch_factor: 8
  drop_last: True

dataset_args:
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 50
    max_num_frames: 400
  resample_rate: 16000
  speed_perturb: False
  num_frms: 150
  aug_prob: 0.6
  frontend: "w2vbert_sv"
  w2vbert_sv_args:
    upstream_args:
      name: config_baseline.json
      path_or_url: assets/w2v-bert-2.0
    frozen: True
    use_lora: False
    frame_shift: 20
    frame_length: 20
  cmvn: False
  cmvn_args:
    norm_mean: False
    norm_var: False
  spec_aug: False
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6

model: SSL_BACKEND_MHFA_LN_GaussianLogPrec_Transformer
model_init: null
model_args:
  feat_dim: -1
  embed_dim: 256
  compression_dim: 128
  head_nb: 64
  train_prior_mean: True
  train_prior_prec: True
  feature_grad_mult: 0.0
  nb_layer: 25
  transformer_num_layers: 1
  transformer_nhead: 8
  transformer_dim_feedforward: 512
  transformer_dropout: 0.1
  transformer_use_position_encoding: False

projection_args:
  project_type: "arc_margin_intertopk_subcenter_uncertainty"
  scale: 32.0
  easy_margin: False

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.0
  final_margin: 0.2
  increase_start_epoch: 6
  fix_start_epoch: 20
  update_margin: True
  increase_type: "exp"

loss: CrossEntropyLoss
loss_args: {}
optimizer: AdamW
optimizer_args:
  weight_decay: 1.0e-7
scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 7.e-4
  final_lr: 1.0e-5
  warm_up_epoch: 4
  warm_from_zero: True
