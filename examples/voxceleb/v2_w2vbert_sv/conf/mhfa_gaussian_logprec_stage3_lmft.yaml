### Stage-3 large-margin fine-tuning (LMFT) config for the MHFA Gaussian
### log-precision recipe. Continues from the stage-2 joint-FT average model.
### Mirrors the reference recipe's s3 (LMFT): long 5.0s chunks, with augmentation,
### margin ramped 0.2 -> 0.4 (exp), plain InterTopK+subcenter projection.
### W2V-BERT 2.0 is unfrozen; frontend receives a 0.5x differential lr.

exp_dir: exp/v2_w2vbert_sv/mhfa_gaussian_logprec_stage3_lmft
gpus: "[2,3]"
num_avg: 2
enable_amp: True
do_lm: False

seed: 716
num_epochs: 3
save_epoch_interval: 1
log_batch_interval: 100

dataloader_args:
  batch_size: 16
  num_workers: 8
  pin_memory: False
  prefetch_factor: 8
  drop_last: True

dataset_args:
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 50
    max_num_frames: 400
  resample_rate: 16000
  speed_perturb: False
  num_frms: 300          # 5.0s chunks for LMFT
  aug_prob: 0.2            # light augmentation in LMFT (prob 0.2)
  frontend: "w2vbert_sv"
  w2vbert_sv_args:
    upstream_args:
      name: config_baseline.json
      path_or_url: assets/w2v-bert-2.0
    frozen: False
    use_lora: False
    frame_shift: 20
    frame_length: 20
  cmvn: False
  cmvn_args:
    norm_mean: False
    norm_var: False
  spec_aug: False
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6

# model: SSL_BACKEND_MHFA_LN_GaussianLogPrec
model: SSL_BACKEND_MHFA_LN_GaussianLogPrec_LightAdapter

model_init: null
model_args:
  feat_dim: -1
  embed_dim: 256
  compression_dim: 128
  head_nb: 64
  train_prior_mean: True
  train_prior_prec: True
  feature_grad_mult: 1.0
  nb_layer: 25

projection_args:
  project_type: "arc_margin_intertopk_subcenter_gap_margin"
  scale: 32.0
  easy_margin: False
  margin_span: 0.10
  margin_clip: 2.0
  gap_momentum: 0.01

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.2
  final_margin: 0.4
  increase_start_epoch: 1
  fix_start_epoch: 2
  update_margin: True
  increase_type: "exp"

loss: CrossEntropyLoss
loss_args: {}

optimizer: AdamW
optimizer_args:
  weight_decay: 1.0e-5

scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 1.0e-5
  final_lr: 1.0e-6
  warm_up_epoch: 0       # no warmup: start directly at initial_lr
  warm_from_zero: False
  frontend_modules: ["frontend"]
  frontend_lr_ratio: 1.0 
