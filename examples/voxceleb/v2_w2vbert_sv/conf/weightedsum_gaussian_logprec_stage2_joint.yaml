### Stage-2 joint fine-tuning config: simple weighted-sum Gaussian log-precision.
### Ablation 2 (no adapter + no MHFA). Continues from stage-1 frozen-frontend.
### 3.0s chunks, stage-1 augmentation, fixed margin 0.2.
### W2V-BERT 2.0 unfrozen; frontend receives a 0.5x differential lr.

exp_dir: exp/v2_w2vbert_sv/weightedsum_gaussian_logprec_stage2_joint
gpus: "[2,3]"
num_avg: 2
enable_amp: True
do_lm: False

seed: 716
num_epochs: 3
save_epoch_interval: 1
log_batch_interval: 100

dataloader_args:
  batch_size: 32
  num_workers: 8
  pin_memory: False
  prefetch_factor: 8
  drop_last: True

dataset_args:
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 50
    max_num_frames: 400
  resample_rate: 16000
  speed_perturb: False
  num_frms: 150          # 3.0s chunks, same as stage-1
  aug_prob: 0.6          # augmentation follows stage-1 (reverb+noise)
  frontend: "w2vbert_sv"
  w2vbert_sv_args:
    upstream_args:
      name: config_baseline.json
      path_or_url: assets/w2v-bert-2.0
    frozen: False
    use_lora: False
    frame_shift: 20
    frame_length: 20
  cmvn: False
  cmvn_args:
    norm_mean: False
    norm_var: False
  spec_aug: False
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6

model: SSL_BACKEND_LN_GaussianLogPrec_WeightedSum

model_init: null
model_args:
  feat_dim: -1
  embed_dim: 256
  compression_dim: 128
  train_prior_mean: True
  train_prior_prec: True
  feature_grad_mult: 1.0
  nb_layer: 25

projection_args:
  project_type: "arc_margin_intertopk_subcenter_uncertainty"
  scale: 32.0
  easy_margin: False

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.2
  final_margin: 0.2
  increase_start_epoch: 1
  fix_start_epoch: 1
  update_margin: False
  increase_type: "exp"

loss: CrossEntropyLoss
loss_args: {}

optimizer: AdamW
optimizer_args:
  weight_decay: 1.0e-5

scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 5.0e-5
  final_lr: 5.0e-6
  warm_up_epoch: 0       # no warmup: start directly at initial_lr
  warm_from_zero: False
  frontend_modules: ["frontend"]
  frontend_lr_ratio: 0.5
